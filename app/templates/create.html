{% extends 'main.html' %}
{% block content %}
<section>
    <div class="form">
        <a href="{% url 'home' %}">
            <button type="button" class="but">HOME</button>
        </a>

        <form action="" method="POST">
            {% csrf_token %}
            <label for="name">NAME</label>
            <input type="text" name="name" id="name" required> <br>

            <label for="gender">GENDER</label>
            <input type="text" name="gender" id="gender" required> <br>

            <label for="phone">PHONE</label>
            <input type="number" name="phone" id="phone" required> <br>

            <label for="email">EMAIL</label>
            <input type="email" name="email" id="email" required> <br>

            <label for="aadhar">AADHAR NUMBER</label>
            <input type="number" name="aadhar" id="aadhar" required> <br>

            <label for="address">ADDRESS</label>
            <textarea name="address" id="address" required></textarea> <br>

            <button class="button" type="submit">SUBMIT</button>
        </form>
    </div>
</section>
{% endblock content %}
